# Settings shared by the api, worker and beat containers (same image, same code, same env).
x-backend: &backend
  build: ./backend
  env_file:
    - .env
  environment:
    DB_HOST: db

services:
  db:
    image: mysql:8.0
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    <<: *backend
    # Only the api migrates: alembic must succeed before uvicorn starts. If it fails, `&&`
    # stops here and the container exits non-zero (see `docker compose logs api`).
    # Dev mode: --reload restarts uvicorn when code in ./backend changes.
    command: >-
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      # /health is 200 only when the DB answers, and uvicorn only runs after migrations,
      # so healthy means migrated. python is used because the slim image has no curl.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  worker:
    <<: *backend
    command: celery -A app.tasks.celery_app worker -l info
    volumes:
      - ./backend:/app
    # Start after the api is healthy, i.e. after it has migrated the database.
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  beat:
    <<: *backend
    command: celery -A app.tasks.celery_app beat -l info -s /tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    # Start after the api is healthy, i.e. after it has migrated the database.
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  db_data:
  uploads:
